<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="cyberCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="auroraPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7928ca"/><stop offset="100%" stop-color="#ff0080"/></linearGradient><linearGradient id="gridGlow" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".15"/><stop offset="100%" stop-color="#00f2fe" stop-opacity=".01"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="badgeGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseDot{0%{opacity:.2;r:2}}@keyframes scanHorizontal{0%{transform:translateX(-400px);opacity:0}50%{opacity:.7}}@keyframes floatUpDown{0%{transform:translateY(0)}}.badge-label,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:900;font-size:44px;letter-spacing:-.5px;fill:#fff}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.badge-label{font-weight:600;font-size:13px;fill:#e2e8f0}.glow-dot{animation:pulseDot 3s ease-in-out infinite alternate}.beam-h{animation:scanHorizontal 8s linear infinite}.orbit-pulse{animation:rotateOrbit 20s linear infinite;transform-origin:1020px 180px}.float-card{animation:floatUpDown 4s ease-in-out infinite alternate}</style><rect width="1200" height="360" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" rx="16"/><g opacity=".4"><line x1="0" x2="1200" y1="60" y2="60" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="0" x2="1200" y1="120" y2="120" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="0" x2="1200" y1="180" y2="180" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="0" x2="1200" y1="240" y2="240" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="0" x2="1200" y1="300" y2="300" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="150" x2="150" y1="0" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="350" x2="350" y1="0" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="550" x2="550" y1="0" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="750" x2="750" y1="0" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/><line x1="950" x2="950" y1="0" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1"/></g><line x1="0" x2="400" y1="180" y2="180" stroke="url(#cyberCyan)" stroke-width="3" class="beam-h" filter="url(#glow)"/><g class="orbit-pulse"><circle cx="1020" cy="180" r="110" fill="none" stroke="#1e293b" stroke-dasharray="6 8" stroke-width="2"/><circle cx="1020" cy="180" r="80" fill="none" stroke="#38bdf8" stroke-dasharray="30 40" stroke-opacity=".3" stroke-width="1.5"/><circle cx="1020" cy="70" r="6" fill="#00f2fe" filter="url(#badgeGlow)"/><circle cx="1130" cy="180" r="4" fill="#a855f7" filter="url(#badgeGlow)"/><circle cx="910" cy="180" r="5" fill="#38bdf8" filter="url(#badgeGlow)"/><circle cx="1020" cy="290" r="5" fill="#ec4899" filter="url(#badgeGlow)"/></g><g transform="translate