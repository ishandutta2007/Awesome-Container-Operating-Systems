<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="auroraPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.01" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .glow-dot {
      animation: pulseDot 3s ease-in-out infinite alternate;
    }
    .beam-h {
      animation: scanHorizontal 8s linear infinite;
    }
    .orbit-pulse {
      animation: rotateOrbit 20s linear infinite;
      transform-origin: 1020px 180px;
    }
    .float-card {
      animation: floatUpDown 4s ease-in-out infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.2; r: 2; }
      100% { opacity: 0.8; r: 5; }
    }
    @keyframes scanHorizontal {
      0% { transform: translateX(-400px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateX(1300px); opacity: 0; }
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatUpDown {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Perspective Mesh Grid (Background) -->
  <g opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />

    <line x1="150" y1="0" x2="150" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="350" y1="0" x2="350" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="550" y1="0" x2="550" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="750" y1="0" x2="750" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="950" y1="0" x2="950" y2="360" stroke="#334155" stroke-dasharray="4 8" stroke-width="1" />
  </g>

  <!-- Glowing Scanning Light Beam across background -->
  <line x1="0" y1="180" x2="400" y2="180" stroke="url(#cyberCyan)" stroke-width="3" filter="url(#glow)" class="beam-h" />

  <!-- Animated Tech Graphic (Right Side Orbit) -->
  <g class="orbit-pulse">
    <circle cx="1020" cy="180" r="110" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 8" fill="none" />
    <circle cx="1020" cy="180" r="80" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="30 40" fill="none" />
    <circle cx="1020" cy="70" r="6" fill="#00f2fe" filter="url(#badgeGlow)" />
    <circle cx="1130" cy="180" r="4" fill="#a855f7" filter="url(#badgeGlow)" />
    <circle cx="910" cy="180" r="5" fill="#38bdf8" filter="url(#badgeGlow)" />
    <circle cx="1020" cy="290" r="5" fill="#ec4899" filter="url(#badgeGlow)" />
  </g>

  <!-- Tech Core Symbol (Immutable Container Hexagon) -->
  <g transform="translate(1020, 180) scale(1.1)">
    <!-- Outer Hexagon -->
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#0f172a" stroke="url(#cyberCyan)" stroke-width="3" filter="url(#glow)" />
    <!-- Inner Hexagon -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#1e293b" stroke="#7928ca" stroke-width="2" />
    <!-- Core Node Dot -->
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Pulsing Ambient Stars / Network Dots in Background -->
  <circle cx="80" cy="70" r="3" fill="#38bdf8" class="glow-dot" />
  <circle cx="220" cy="310" r="4" fill="#818cf8" class="glow-dot" style="animation-delay: 1s;" />
  <circle cx="680" cy="60" r="3" fill="#06b6d4" class="glow-dot" style="animation-delay: 2s;" />
  <circle cx="840" cy="320" r="3.5" fill="#c084fc" class="glow-dot" style="animation-delay: 1.5s;" />

  <!-- FOREGROUND CONTENT: Header, Typography & Interactive Badge Pills -->
  <g transform="translate(70, 75)">
    <!-- Top Micro Category Label -->
    <g transform="translate(0, 0)">
      <rect width="210" height="26" rx="13" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4.5" fill="#00f2fe" filter="url(#badgeGlow)" />
      <text x="26" y="17.5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CLOUD-NATIVE &amp; LINUX</text>
    </g>

    <!-- Main Title with Gradient fill on Container OS -->
    <text x="0" y="65" class="title-text">
      Awesome <tspan fill="url(#cyberCyan)">Container Operating Systems</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="105" class="subtitle-text">
      Curated Immutable Linux Distributions, Minimal Container Appliances &amp; Kubernetes Hosts
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 140)">
      <!-- Pill 1: Immutable Architecture -->
      <g transform="translate(0, 0)" class="float-card">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="1" y="1" width="178" height="40" rx="9" fill="none" stroke="#38bdf8" stroke-opacity="0.3" />
        <text x="16" y="26" class="badge-label">🔒 Read-Only / Immutable</text>
      </g>

      <!-- Pill 2: Atomic A/B Upgrades -->
      <g transform="translate(195, 0)" class="float-card" style="animation-delay: 0.5s;">
        <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="1" y="1" width="183" height="40" rx="9" fill="none" stroke="#c084fc" stroke-opacity="0.3" />
        <text x="16" y="26" class="badge-label">⚡ Atomic A/B Updates</text>
      </g>

      <!-- Pill 3: Zero-Touch K8s Appliance -->
      <g transform="translate(395, 0)" class="float-card" style="animation-delay: 1s;">
        <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="1" y="1" width="193" height="40" rx="9" fill="none" stroke="#34d399" stroke-opacity="0.3" />
        <text x="16" y="26" class="badge-label">☸️ API-Driven K8s Hosts</text>
      </g>

      <!-- Pill 4: Production Hardened -->
      <g transform="translate(605, 0)" class="float-card" style="animation-delay: 1.5s;">
        <rect width="175" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="1" y="1" width="173" height="40" rx="9" fill="none" stroke="#f472b6" stroke-opacity="0.3" />
        <text x="16" y="26" class="badge-label">🛡️ Minimal Attack Surface</text>
      </g>
    </g>
  </g>
</svg>
